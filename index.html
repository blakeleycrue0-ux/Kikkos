<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <!-- viewport-fit=cover lets the page paint edge to edge; safe areas are handled in CSS with env(). -->
    <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
    <meta name="color-scheme" content="light" />
    <!-- Updated per screen at runtime (see src/components/chrome.ts). -->
    <meta name="theme-color" content="#3777F6" />
    <style>html,body{margin:0;background:#3777F6}</style>
    <!-- Installed web app (Add to Home Screen) -->
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta name="mobile-web-app-capable" content="yes" />
    <!-- "default": iOS draws the status bar with readable text and our theme colour;
         "black-translucent" would force white text over the cream screens. -->
    <meta name="apple-mobile-web-app-status-bar-style" content="default" />
    <meta name="apple-mobile-web-app-title" content="KIKKO" />
    <meta name="description" content="KIKKO: one short game every day. Compete with the world, or with your friends." />
    <link rel="icon" type="image/png" href="/favicon.png" />
    <link rel="apple-touch-icon" href="/apple-touch-icon.png" />
    <link rel="manifest" href="/manifest.webmanifest" />
    <link rel="apple-touch-startup-image" href="/splash/launch-750x1334.png" media="(device-width: 375px) and (device-height: 667px) and (-webkit-device-pixel-ratio: 2) and (orientation: portrait)" />
