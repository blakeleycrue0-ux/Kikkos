<!doctype html>
<html lang="es">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <meta name="theme-color" content="#0a0a0d">
  <meta name="robots" content="noindex">
  <meta name="referrer" content="no-referrer">
  <title>FFSP · Mando de retransmisión</title>
  <link rel="stylesheet" href="/css/base.css">
  <link rel="stylesheet" href="/css/control.css">
</head>
<body>
  <div id="app" hidden>
    <header class="top">
      <div class="brand"><span class="brand-mark">FFSP</span><span class="brand-sub" id="matchTitle"></span></div>
      <div class="top-r">
        <button class="chip obs" id="obsChip" data-goto="clips" title="Estado de OBS"></button>
        <span class="chip conn" id="connChip"></span>
      </div>
    </header>
    <div id="offline" class="banner bad" hidden></div>
    <div id="pend" class="pend" hidden></div>
    <main id="main">
      <section id="tab-live" class="tab"></section>
      <section id="tab-events" class="tab" hidden></section>
      <section id="tab-clips" class="tab" hidden></section>
      <section id="tab-air" class="tab" hidden></section>
      <section id="tab-more" class="tab" hidden></section>
    </main>
    <nav class="tabs" id="tabs">
      <button data-tab="live" class="on"><svg viewBox="0 0 24 24"><circle cx="12" cy="12" r="3.2"/><path d="M5.6 5.6a9 9 0 0 0 0 12.8M18.4 5.6a9 9 0 0 1 0 12.8"/></svg><span>Directo</span></button>
      <button data-tab="events"><svg viewBox="0 0 24 24"><path d="M5 6h14M5 12h14M5 18h9"/></svg><span>Eventos</span></button>
      <button data-tab="clips"><svg viewBox="0 0 24 24"><rect x="3.5" y="5.5" width="17" height="13" rx="2.5"/><path d="M10.2 9.4v5.2l4.4-2.6z"/></svg><span>Clips</span><i id="clipBadge" hidden></i></button>
      <button data-tab="air"><svg viewBox="0 0 24 24"><rect x="3" y="4" width="18" height="12" rx="2"/><path d="M8 20h8M12 16v4"/></svg><span>Emisión</span></button>
      <button data-tab="more"><svg viewBox="0 0 24 24"><circle cx="5" cy="12" r="1.4"/><circle cx="12" cy="12" r="1.4"/><circle cx="19" cy="12" r="1.4"/></svg><span>Ajustes</span></button>
    </nav>
  </div>

  <div id="login" class="login" hidden>
    <form id="loginForm" autocomplete="off">
      <div class="brand-mark big">FFSP</div>
      <h1>Mando de retransmisión</h1>
      <p>Introduce la clave de control que aparece en el portátil.</p>
      <input id="loginKey" type="text" inputmode="text" autocapitalize="characters" autocorrect="off" spellcheck="false" placeholder="XXXX-XXXX" maxlength="12">
      <button class="btn primary" type="submit">Entrar</button>
      <div id="loginErr" class="err"></div>
    </form>
  </div>

  <div id="sheetWrap" class="sheet-wrap" hidden><div class="sheet" id="sheet" role="dialog" aria-modal="true"></div></div>
  <div id="toasts" aria-live="polite"></div>
  <script type="module" src="/js/control.js"></script>
</body>
</html>
